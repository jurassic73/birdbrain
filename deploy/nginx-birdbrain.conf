# Inside the somegeek.com server { } block on the DigitalOcean droplet.
# The app runs with BIRDBRAIN_BASE=/birdbrain; nginx strips the prefix on the way in.
location = /birdbrain { return 301 /birdbrain/; }
location /birdbrain/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
