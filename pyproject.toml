[project]
name = "birdbrain"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
